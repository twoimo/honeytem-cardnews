[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honeytem-cardnews"
version = "0.1.0"
description = "Evidence-first, offline magazine cardnews review packages"
requires-python = ">=3.11"
dependencies = ["Pillow==12.3.0", "fonttools==4.61.1"]
license = {text = "MIT"}

[project.scripts]
honeytem = "honeytem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
